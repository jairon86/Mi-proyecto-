
name: Compilar Conecta APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'conecta_supabase.html'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar aplicación
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir -p www
          cp conecta_supabase.html www/index.html
          npx cap init Conecta com.conecta.app --web-dir=www

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Sincronizar Android
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Conecta-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
